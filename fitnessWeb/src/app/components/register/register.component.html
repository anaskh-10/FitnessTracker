<div class="center-form">
    <img src="https://www.ehealth.gov.hk/assets/images/you-and-your-family/personally-reg-01.png" alt="Logo">
    <h2>
        Enter Details to Register
    </h2>
    <form nz-form [formGroup]="registerForm"(ngSubmit)="submitForm()" class="custom-form">
        
        <nz-form-item>
            <nz-form-control nzErrorTip="Please input your username!">
                <nz-input-group nzPrefixIcon="idcard">
                    <input type="text" nz-input formControlName="username" placeholder="Enter username">
                </nz-input-group>
            </nz-form-control>
        </nz-form-item>
        <nz-form-item>
            <nz-form-control nzErrorTip="Please input your password!">
                <nz-input-group nzPrefixIcon="idcard">
                    <input type="password" nz-input formControlName="password" placeholder="Enter password">
                </nz-input-group>
            </nz-form-control>
        </nz-form-item>
        <button nz-button nzType="primary" nzBlock [disabled]="registerForm.invalid" class="w-100">
            Register
        </button>
    </form>
</div>
