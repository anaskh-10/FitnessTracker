<nz-layout class="app-layout">
  <nz-sider nzCollapsible [(nzCollapsed)]="isCollapsed" class="app-sidebar"*ngIf="!isUserLoggedIn">
    <div class="logo">
      <div class="avatar-container">
        <img src="https://thumbs.dreamstime.com/b/print-161388179.jpg" alt="Avatar" class="avatar">
      </div>
      <div class="user-info">
        <strong>FitnessTracker</strong>
      </div>
    </div>
    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li nz-menu-item routerLink="/register">
        <span nz-icon nzType="user"></span>
        <span>register</span>
      </li>
      <li nz-menu-item routerLink="/login">
        <span nz-icon nzType="login"></span>
        <span>login</span>
      </li>
    </ul>
  </nz-sider>

  <nz-sider nzCollapsible [(nzCollapsed)]="isCollapsed" class="app-sidebar"*ngIf="isUserLoggedIn">
    <div class="logo">
      <div class="avatar-container">
        <img src="https://thumbs.dreamstime.com/b/print-161388179.jpg" alt="Avatar" class="avatar">
      </div>
      <div class="user-info">
        <strong>FitnessTracker</strong>
      </div>
    </div>
    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li nz-menu-item routerLink="/dashboard">
        <span nz-icon nzType="dashboard"></span>
        <span>Dashboard</span>
      </li>
      <li nz-menu-item routerLink="/workout">
        <span nz-icon nzType="split-cells"></span>
        <span>Workout</span>
      </li>
      <li nz-menu-item routerLink="/activity">
        <span nz-icon nzType="control"></span>
        <span>Activity</span>
      </li>
      <li nz-menu-item routerLink="/goal">
        <span nz-icon nzType="fund"></span>
        <span>Goal</span>
      </li>
      <li nz-menu-item (click)="logout()">
        <span nz-icon nzType="logout"></span>
        <span>logout</span>
      </li>
    </ul>
  </nz-sider>

  <nz-layout class="app-content">
    <nz-header class="app-header">
    </nz-header>
    <nz-content class="app-inner-content">
      <router-outlet></router-outlet>
    </nz-content>
  </nz-layout>
</nz-layout>
